const fillT=s=>String(s||'').replace(/\{name\}/g,S.name).replace(/\{greeting\}/g,greet());
const hd=b=>`<h3>${b.icon?esc(b.icon)+' ':''}${esc(fillT(b.title))}</h3>`+(b.desc?`<small>${esc(b.desc)}</small>`:'');
const curPrompt=()=>{const ps=(S.prompts||[]).filter(Boolean);return ps.length?ps[(dayN()+(V.pi||0))%ps.length]:''};
function welcomeB(b){const d=new Date(),[c,s]=sty(b,-1),ms=(b.msgs||[]).filter(Boolean),m=ms.length?(b.mode==='static'?ms[0]:b.mode==='random'?ms[RND%ms.length]:ms[dayN()%ms.length]):'',fz={s:'24px',m:'31px',l:'38px'}[b.size]||'31px';
 return `<div class="welcome ${c||'gd'} ${b.align==='center'?'ctr':''}" ${s}>${b.icon?`<div class=wic>${esc(b.icon)}</div>`:''}${b.showDate!==0?`<small>${d.toLocaleDateString('en',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</small>`:''}<h1 style="font-size:${fz}">${esc(fillT(b.title))}</h1>${b.showHi!==0?`<p class=hi>${greet()}, ${esc(S.name)}</p>`:''}${m?`<p class=gm>${esc(fillT(m))}</p>`:''}</div>`}
function intentB(b,pv){const it=S.int[ymd()]||[],n=b.n||2,[c,s]=sty(b,7);return `<div class="card ${c}" ${s}>${hd(b)}${[...Array(n)].map((_,i)=>`<input ${pv?'disabled':`data-u=int data-i=${i}`} value="${esc(it[i]||'')}" placeholder="${esc((b.ph||[])[i]||'')}" maxlength=140 ${i?'style="margin-top:8px"':''} aria-label="Intention ${i+1}">`).join('')}${b.note?`<small>${esc(b.note)}</small>`:''}</div>`}
function inspireB(b){const q=dq(b.src),[c,s]=sty(b,1);return `<div class="card ${c}" ${s}>${hd(b)}${q?qrow(q):'<small>No quotes match yet. Add some in Personalise › Daily prompts & quotes.</small>'}</div>`}
function reflectB(b,pv){const cl=S.cl[ymd()]||{},[c,s]=sty(b,0);return `<div class="card ${c}" ${s}>${hd(b)}${(b.qs||[]).filter(q=>!q.h).map(q=>`<label>${esc(q.q)}</label><textarea rows=2 ${pv?'disabled':`data-u=cl data-k=${q.id}`} placeholder="Optional">${esc(cl[q.id]||'')}</textarea>`).join('')}<small>Optional. Saved quietly on this device, by date.</small>${b.link&&!pv?`<br><button class=link data-a=open data-id=ritual>Open the full closing ritual ›</button>`:''}</div>`}
function promptB(b,pv){const [c,s]=sty(b,4),q=curPrompt(),a=(S.pa[ymd()]||{})[q]||'';
 return `<div class="card ${c}" ${s}>${hd(b)}${q?`<p class=pq>${esc(q)}</p><textarea rows=3 ${pv?'disabled':'data-u=pa'} placeholder="Optional">${esc(a)}</textarea><div class=row><small>Optional. Saved by date.</small>${pv?'':'<button class=link data-a=pnext>Another question</button>'}</div>`:'<small>Add questions in Personalise › Daily prompts & quotes.</small>'}</div>`}
function noteB(b){const [c,s]=sty(b,5);return `<div class="card ${c}" ${s}>${hd(b)}<p style="white-space:pre-wrap;margin:.4em 0">${esc(fillT(b.text||''))}</p></div>`}
function cardsB(b,pv){const k=ymd(),all=ordCards().filter(c=>!c.hide),cs=S.lim>0?all.slice(0,S.lim):all;
 return `<div class=row style="margin-top:20px"><h3>${esc(fillT(b.title))}</h3>${pv?'':'<button class=btn style="flex:none;padding:10px 16px;min-height:44px" data-a=newcard>＋ Add card</button>'}</div>
 ${cs.length?`<div class=grid>${cs.map(c=>{const n=cts(c.id).map(x=>x[0]),te=S.e.filter(e=>e.d===k&&n.includes(e.t)).length,[cc,cs2]=sty(c,c.a);return `<div class="tile ${cc}" ${cs2} data-a=ocard data-id=${c.id} role=button tabindex=0>${V.edit&&!pv?`<div class=tbar><button class=mini data-a=editcard data-id=${c.id} aria-label="Edit card">✎</button><button class=mini data-a=hidecat data-id=${c.id} aria-label="Hide card">−</button></div>`:''}<span class=ti>${esc(c.i)}</span><b>${esc(c.n)}</b><small>${esc(c.d)}</small><em>${te?te+' recorded today':'Open when you’re ready'}</em></div>`}).join('')}</div>`:'<div class=card><p>No cards are showing right now.</p><p class=hint>Open the card library to bring some back, or add a new one.</p></div>'}
 ${pv?'':`<div class=row style="margin-top:12px"><button class=ghost data-a=open data-id=lib>${all.length>cs.length?`View all ${all.length} cards`:'Card library & layout'}</button></div>`}`}
const BODY={welcome:welcomeB,intent:intentB,inspire:inspireB,reflect:reflectB,prompt:promptB,note:noteB,cards:cardsB};
const blkBody=(b,pv)=>BODY[b.type]?BODY[b.type](b,pv):'';
const ebar=b=>`<div class=ebar><small style="margin-right:auto">${BT[b.type]}${b.hide?' · hidden':''}</small><button class=mini data-a=bup data-id=${b.id} aria-label="Move up">↑</button><button class=mini data-a=bdn data-id=${b.id} aria-label="Move down">↓</button><button class=mini data-a=bed data-id=${b.id} aria-label="Edit">✎</button><button class=mini data-a=bhide data-id=${b.id} aria-label="${b.hide?'Show':'Hide'}">${b.hide?'＋':'−'}</button></div>`;
function home(){let h=`<div class=top><span class=brand>LIFEBOARD</span><span style="display:flex;gap:8px"><button class="mini ${V.edit?'on':''}" data-a=etog aria-label="Edit home screen">✎</button><button class=mini data-a=quick aria-label="Add a moment">＋</button></span></div>`;
 if(V.edit)h+=`<div class="card a7"><b>Editing your home</b><br><small>Move, edit, hide or show any block. Nothing is lost.</small><div class=chips><button class=chip data-a=addblk>＋ Add block</button><button class=chip data-a=open data-id=pers>Personalise…</button><button class="chip on" data-a=etog>Done</button></div></div>`;
 S.home.forEach(b=>{if(b.hide&&!V.edit)return;h+=`<section class="blk ${b.hide?'off':''}">${V.edit?ebar(b):''}${blkBody(b)}</section>`});
 if(!S.home.some(b=>!b.hide))h+='<div class=card><p>Your home screen is empty right now.</p><button class=chip data-a=etog>Edit home</button></div>';
 if(!S.e.length)h+=`<div class=card><b>Just exploring?</b><br><small>You can add a few sample moments to look around. Remove them any time.</small><br><button class=chip style="margin-top:8px" data-a=sample>Add sample moments</button></div>`;
 return h+(S.phil?`<p class=phil style="white-space:pre-line">${esc(S.phil)}</p>`:'')}

/* ---------- CARD PAGE ---------- */
function tp(t,k){if(t.col&&isHex(t.col.bg))return sty(t,0);if(t.a>=0)return sty(t,0);const tc=(TD||S).tc||{},c=k==='people'&&tc.prof?tc.prof:t.tab==='ideas'&&tc.ideas?tc.ideas:tc.inner;if(c)return sty({col:{bg:c}},0);return['a'+ac(t),'']}
const edBtn=()=>`<button class="chip ${V.edit?'on':''}" data-a=etog>${V.edit?'Done editing':'✎ Edit sections'}</button>`;
const secRow=(k,t,rm,key)=>{const te=S.e.filter(e=>e.t===k&&e.d===ymd()),m=te.reduce((a,e)=>a+mins(t,e),0),sub=t.d?esc(t.d):(t.sp==='naam'?`${S.nj[ymd()]||0} today`:`${te.length?te.length+' recorded today':'Whenever you’re ready'}${m?' · '+m+' min':''}`),[c,s]=tp(t,k);
 const mv=d=>`<button class=mini data-a=smv data-id=${k} data-key="${key}" data-d=${d} aria-label="${d<0?'Move up':'Move down'}">${d<0?'↑':'↓'}</button>`;
 return `<div class="card trow ${c} ${V.edit?'ed':''}" ${s} data-a=open data-sw=${k} data-id=${k}><div class=ico>${esc(t.i)}</div><div class=grow><b>${esc(t.n)}</b><br><small>${sub}</small></div>${V.edit?`<div class=erow><button class=mini data-a=sed data-id=${k} aria-label="Edit section">✎</button>${mv(-1)}${mv(1)}<button class=mini data-a=${rm} data-id=${k} aria-label="Remove from here">−</button></div>`:`${t.sp==='naam'?`<button class=mini data-a=njp aria-label="Add one">+1</button>`:`<button class=mini data-a=add data-id=${k} aria-label="New entry">＋</button>`}<button class=mini data-a=${rm} data-id=${k} aria-label="Remove from here">−</button>`}</div>`};
function cardPage(id){const c=gc(id);if(!c)return home();const ts=ordered('c:'+id,cts(id)),ks=ts.map(x=>x[0]),wkN=S.e.filter(e=>e.d>=ago(6)&&ks.includes(e.t)),wm=wkN.reduce((a,e)=>a+mins(S.tr[e.t],e),0),[cc,cs]=sty(c,c.a);
 return `<div class=row><button class=mini data-a=back aria-label="Back">‹</button><span style="display:flex;gap:8px"><button class=mini data-a=editcard data-id=${c.id} aria-label="Edit card">✎</button><button class=mini data-a=hidecat data-id=${c.id} aria-label="Hide card">−</button></span></div>
 <div class="hero2 ${cc}" ${cs}><div class=big>${esc(c.i)}</div><h2 style="text-transform:uppercase;letter-spacing:.08em;font-size:22px">${esc(c.n)}</h2><p>${esc(c.d)}</p>${dotsFor(ks)}<small>${wkN.length?`This week: ${wkN.length} moment${wkN.length==1?'':'s'} recorded${wm?' · '+wm+' min':''}`:'A quiet week here, and that is fine.'}</small></div>
 <div class=row style="margin-top:18px"><h3>Sections</h3><button class=btn style="flex:none;padding:10px 16px;min-height:44px" data-a=addsec data-card=${c.id}>＋ Add section</button></div>
 <div class=chips style="margin:6px 0">${edBtn()}</div><small>Tap − (or swipe left) to tuck a section away. Nothing is deleted.</small>
 ${ts.map(([k,t])=>secRow(k,t,'rmcard','c:'+id)).join('')||'<div class=card><p>This card is empty for now.</p><p class=hint>Use ＋ Add section to bring in a section or create your own.</p></div>'}`}
/* ---------- TAB PAGES ---------- */
function tabp(tab){if(tab==='more')return more();const ts=ordered('t:'+tab,Object.entries(S.tr).filter(([k,t])=>inTab(t,tab)&&!t.hide)),nv=S.nv;
 return `<div class=row><h2>${esc(nv.title[tab]||TN[tab])}</h2><button class=mini data-a=addsec data-tab=${tab} aria-label="Add a section">＋</button></div><p class=sub>${esc(nv.sub[tab]!==undefined?nv.sub[tab]:TSUB[tab])}</p><div class=chips style="margin:0 0 6px">${edBtn()}</div><small>Tap − or swipe a section left to tuck it away from here. Nothing is deleted.</small>`+ts.map(([k,t])=>secRow(k,t,'rmtab','t:'+tab)).join('')+`<button class=ghost style="width:100%;margin-top:6px" data-a=addsec data-tab=${tab}>＋ Add a section here</button>`}
function more(){const L=(i,t,id,sub,x)=>`<div class="card trow" data-a=${x||'open'} data-id=${id}${x==='openr'?` data-p=${sub[1]}`:''}><div class=ico>${i}</div><div class=grow><b>${t}</b><br><small>${x==='openr'?sub[0]:sub}</small></div><span class=chev>›</span></div>`,ts=Object.entries(S.tr).filter(([k,t])=>inTab(t,'more')&&!t.hide);
 return `<h2>${esc(S.nv.title.more||'More')}</h2><p class=sub>Look back, make it yours, and keep your data safe.</p>
 <div class="card a1"><b>Light or dark</b><div class=chips>${thc()}</div></div>
 <h4 class=sec>Look back</h4>${L('🕘','Recent entries','recent','Search and filter everything you have recorded')}${L('📅','Calendar','cal','See your days at a glance')}${L('📖','Daily history','hist','Day by day')}${L('🌤','Weekly reflection','x',['What this week held, in your words','week'],'openr')}${L('🌙','Monthly reflection','x',['What this month held, in your words','month'],'openr')}${L('📊','Progress & insights','reports','Gentle patterns, no judgement')}
 <h4 class=sec>Make it yours</h4>${L('🎨','Personalise my LIFEBOARD','pers','Home, welcome, closing ritual, colours, icons, prompts, navigation')}${L('🗂','Card library','lib','Order, pin, hide, add and choose how many cards show')}${L('🫥','Hidden cards & sections','hidden','Bring tucked-away things back')}${L('🎛','Customise sections & fields','custom','Rename, move and change fields')}${L('⚙','App settings','settings','Your name, appearance, dashboard')}
 <h4 class=sec>Closing & inspiration</h4>${ts.map(([k,t])=>L(esc(t.i),esc(t.n),k,t.d?esc(t.d):'Optional · a few minutes')).join('')}${L('💬','Quote library','quotes','Favourites and your own quotes')}
 <h4 class=sec>Your data</h4>${L('💾','Backup, export & import','backup','Keep your records safe')}
 <div class=card><b>AI assistants</b><p class=hint>These links only open their websites. LIFEBOARD never sends your journal anywhere.</p><div class=chips><a class=chip href="https://claude.ai" target=_blank rel=noopener>Claude</a><a class=chip href="https://chatgpt.com" target=_blank rel=noopener>ChatGPT</a><a class=chip href="https://gemini.google.com" target=_blank rel=noopener>Gemini</a></div></div>
 <button class=ghost style="width:100%" data-a=addsec data-tab=more>＋ Add a section to More</button>`}

/* ---------- PERSONALISE: hub and area pages ---------- */
const PL=(i,t,id,sub)=>`<div class="card trow" data-a=open data-id=${id}><div class=ico>${i}</div><div class=grow><b>${t}</b><br><small>${sub}</small></div><span class=chev>›</span></div>`;
const rbtn=(a,l)=>`<button class=ghost style="width:100%;margin-top:10px" data-a=${a}>↺ ${l}</button>`;
function pers(){return back('Personalise my LIFEBOARD')+`<p class=sub>Change almost anything here. Nothing is deleted, and every area can be restored to its default on its own.</p>`
 +PL('🏠','A · Home screen layout','play','Order, show and hide the blocks on your home screen')+PL('👋','B · Welcome section','welset','Headings, messages, colours and extra welcome cards')+PL('🌅','C · Closing ritual & reflections','clset','Your own questions, wording, colours and cards')+PL('🗂','D · Card library','lib','Add, order, hide and recolour your cards')+PL('🎨','E · Colour & theme studio','studio','Palettes and custom colours, with a live preview')+PL('🔤','F · Icons & typography','typo','Fonts, text size and icons')+PL('💬','G · Daily prompts & quotes','gq','Quotes, questions and how they rotate')+PL('💡','H · Ideas Studio','idset','Name, sections and idea options')+PL('🧭','I · Navigation','navset','Rename, hide and reorder the bottom tabs')+rbtn('restall','Restore every personalisation to default')}
const blkRow=b=>`<div class="card trow ed" style="${b.hide?'opacity:.65':''}"><div class=ico>${esc(b.icon||'🏠')}</div><div class=grow><b>${esc(fillT(b.title))}</b><br><small>${BT[b.type]}${b.hide?' · hidden':''}</small></div><div class=erow><button class=mini data-a=bed data-id=${b.id} aria-label="Edit">✎</button><button class=mini data-a=bup data-id=${b.id} aria-label="Move up">↑</button><button class=mini data-a=bdn data-id=${b.id} aria-label="Move down">↓</button><button class=mini data-a=bhide data-id=${b.id} aria-label="${b.hide?'Show':'Hide'}">${b.hide?'＋':'−'}</button></div></div>`;
function play(){return back('Home screen layout')+`<p class=sub>Order your blocks. ✎ changes wording, icon and colour. − hides a block and ＋ brings it back.</p><div class=row><button class=btn data-a=addblk>＋ Add block</button><button class=ghost data-a=editHome>Edit on the home screen</button></div>`+S.home.map(blkRow).join('')+limBox()+`<div class=card><b>Closing line at the bottom</b><textarea rows=3 data-u=phil placeholder="Leave empty to hide it">${esc(S.phil||'')}</textarea></div>`+rbtn('playrest','Restore default home layout')}
function welset(){return back('Welcome section')+`<p class=sub>Rename the greeting, write your own messages, change colours, or add more welcome sections.</p><button class=btn style="width:100%" data-a=addblk data-t=welcome>＋ Add a welcome section</button>`+S.home.filter(b=>b.type==='welcome').map(blkRow).join('')+rbtn('welrest','Restore default welcome section')}
function clset(){const r=S.tr.ritual;return back('Closing ritual & reflections')+`<p class=sub>Create reflection cards with your own questions. All answers are optional and saved by date.</p><button class=btn style="width:100%" data-a=addblk data-t=reflect>＋ Add a reflection card</button>`+S.home.filter(b=>b.type==='reflect').map(blkRow).join('')+(r?`<div class="card trow" data-a=sed data-id=ritual><div class=ico>${esc(r.i)}</div><div class=grow><b>${esc(r.n)}</b><br><small>The full closing ritual (in More). Rename, recolour or change its questions.</small></div><span class=chev>›</span></div>`:'')+rbtn('clrest','Restore default closing ritual')}
/* ---------- colour & theme studio (live preview, saved only when you press Save) ---------- */
const TCK=[['bg','App background'],['ink','Text (light mode)'],['btn','Buttons'],['icon','Icons'],['prog','Progress indicators'],['nav','Bottom navigation'],['inner','Inner cards'],['prof','Profile cards'],['ideas','Ideas Studio']];
function ensureTD(){if(!TD)TD={pal:S.pal,tc:{...S.tc},ty:{...S.ty}}}
function tcDef(k){const p=palOf(TD.pal);return{bg:p.bg,ink:INK,btn:p.acc,icon:'#FFFFFF',prog:p.acc,nav:'#FFFFFF',inner:p.p[0],prof:p.p[0],ideas:p.p[7]}[k]}
function tcWarn(k){const tc=TD.tc,p=palOf(TD.pal),v=tc[k];if(!v)return'';const out=(r,t)=>`<div class="${r>=4.5?'ok':'wn'}">${r>=4.5?'✓':'⚠'} ${t} ${r.toFixed(1)}:1${r>=4.5?'':'. Hard to read, try a different colour.'}</div>`;
 if(k==='bg')return out(cr(tc.ink||INK,v),'Text on this background:');if(k==='ink')return out(cr(v,tc.bg||p.bg),'Text on the background:');
 if(k==='btn'||k==='inner'||k==='prof'||k==='ideas')return out(cr(v,autoFg(v)),k==='btn'?'Button label:':'Text on these cards:');
 if(k==='nav')return out(cr(tc.ink?mixc(tc.ink,tc.bg||p.bg,.25):'#665B6D',v),'Tab labels on this bar:');
 if(k==='prog'){const r=cr(v,'#EBDDE6');return`<div class="${r>=3?'ok':'wn'}">${r>=3?'✓':'⚠'} Visibility on the progress track ${r.toFixed(1)}:1</div>`}return''}
const tdBar=()=>`<div class="card a7 sticky"><div class=row><button class=btn data-a=tsave>Save</button><button class=ghost data-a=tdisc>Discard changes</button></div></div>`;
function studio(){ensureTD();const tc=TD.tc;
 return back('Colour & theme studio')+`<p class=sub>Changes preview live across the whole app. Nothing is kept until you press Save.</p><div class=card><b>Mode</b><div class=chips>${thc()}</div><small>Dark versions of your colours are designed automatically: same hue, softer and deeper.</small></div><h4 class=sec>Palettes</h4>`
 +PAL.map(p=>`<button class="palc ${TD.pal===p.id?'on':''}" data-a=pal data-id=${p.id}><b>${p.name}</b><div class=pal>${p.p.map(c=>`<i style="background:${c}"></i>`).join('')}</div><small>${p.note}</small></button>`).join('')
 +`<h4 class=sec>My colours</h4>`+TCK.map(([k,l])=>`<div class=card><div class=row><b>${l}</b>${tc[k]?`<button class=link data-a=tcclr data-k=${k}>Use default</button>`:'<small>Following palette</small>'}</div><div class=sty><input type=color data-u=tc data-k=${k} value="${tc[k]||tcDef(k)}" aria-label="${l}"><small>${tc[k]||'Tap to choose any colour'}</small></div><div id=tw_${k}>${tcWarn(k)}</div></div>`).join('')
 +`<h4 class=sec>Colours for each part</h4><p class=hint>Each home block, card and section has its own colour controls. Tap one to change it.</p>`
 +S.home.map(b=>{const[c,s]=sty(b,BDEF[b.type]);return`<div class="card trow ${c}" ${s} data-a=bed data-id=${b.id}><div class=ico>${esc(b.icon||'🏠')}</div><div class=grow><b>${esc(fillT(b.title))}</b><br><small>${BT[b.type]}</small></div><span class=chev>›</span></div>`}).join('')
 +S.cards.map(c=>{const[cc,s]=sty(c,c.a);return`<div class="card trow ${cc}" ${s} data-a=editcard data-id=${c.id}><div class=ico>${esc(c.i)}</div><div class=grow><b>${esc(c.n)}</b><br><small>Card</small></div><span class=chev>›</span></div>`}).join('')
 +tdBar()+rbtn('studrest','Restore default colours')}
function typo(){ensureTD();const ty=TD.ty;
 return back('Icons & typography')+`<p class=sub>The preview is live. Press Save to keep it.</p><div class=card><b>Heading font</b><div class=chips>${Object.entries(FONTS).map(([k,v])=>`<button class="chip ${(ty.head||'serif')===k?'on':''}" style="font-family:${v[1]}" data-a=tyh data-id=${k}>${v[0]}</button>`).join('')}</div><b style="display:block;margin-top:16px">Text size</b><div class=chips>${SIZES.map(([n,v])=>`<button class="chip ${(ty.size||1)===v?'on':''}" data-a=tys data-v=${v}>${n}</button>`).join('')}</div></div>${tdBar()}`
 +`<h4 class=sec>Icons</h4><p class=hint>Type or paste any emoji. Icons save as you type.</p><b>Cards</b>`+S.cards.map(c=>`<div class=fr><span style="font-size:26px;width:44px;text-align:center">${esc(c.i)}</span><input value="${esc(c.i)}" maxlength=4 data-c=icoc data-id=${c.id} aria-label="Icon for ${esc(c.n)}"><small style="align-self:center;flex:1">${esc(c.n)}</small></div>`).join('')

A.idrest=()=>ask('Restore the default Ideas Studio wording and options?',()=>{const df=mk(DD.ideas);S.tr.ideas.f.forEach(f=>{const x=df.find(y=>y.k===f.k);if(x){f.o=x.o;f.l=x.l;if(f.k==='done')f.h=0}});delete S.nv.label.ideas;delete S.nv.title.ideas;delete S.nv.sub.ideas;go()},'Restore');
/* navigation */
C.nvl=el=>{S.nv.label[el.dataset.id]=el.value.trim()||DEFNAV().label[el.dataset.id];go()};C.nvt=el=>{S.nv.title[el.dataset.id]=el.value.trim()||TN[el.dataset.id];go()};C.nvs=el=>{S.nv.sub[el.dataset.id]=el.value;go()};C.nve=el=>{S.nv.emo[el.dataset.id]=el.value.trim();go()};C.nvlab=el=>{S.nv.labels=el.checked?1:0;go()};
A.nvmv=d=>{const a=S.nv.order,i=a.indexOf(d.id),j=i+ +d.d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];go()};A.nvhide=d=>{S.nv.hide[d.id]=S.nv.hide[d.id]?0:1;go()};
A.navrest=()=>ask('Restore the default tab names, order and icons?',()=>{S.nv=DEFNAV();go()},'Restore');
/* restore defaults for each area */
A.playrest=()=>ask('Restore the default home layout? Your wording and colours on home blocks go back to default too.',()=>{S.home=DBL();S.phil=PHIL;go()},'Restore');
A.welrest=()=>ask('Restore the default welcome section? Extra welcome sections are removed.',()=>{const w=DBL()[0],i=S.home.findIndex(b=>b.type==='welcome');S.home=S.home.filter(b=>b.type!=='welcome');S.home.splice(Math.max(i,0),0,w);go()},'Restore');
A.clrest=()=>ask('Restore the default closing ritual? Answers you already wrote are kept.',()=>{const d=DBL().find(b=>b.id==='closing'),i=S.home.findIndex(b=>b.id==='closing');if(i<0)S.home.push(d);else S.home[i]=d;const r=S.tr.ritual,df=DD.ritual;if(r){r.n=df[1];r.i=df[2];delete r.col;delete r.a;delete r.d}go()},'Restore');
A.restall=()=>ask('Restore every personalisation to its default (colours, wording, home layout, tabs, prompts)? Your entries, answers and your own cards and sections are kept.',()=>{S.pal='pinklav';S.tc={};S.ty={};S.home=DBL();S.phil=PHIL;S.nv=DEFNAV();S.prompts=DP.slice();S.qs={src:'all',rot:'daily'};S.ord={};TD=null;S.cards.forEach(c=>{delete c.col;const d=DC.find(x=>x.id===c.id);if(d)Object.assign(c,d)});Object.entries(S.tr).forEach(([k,t])=>{delete t.col;delete t.a;delete t.d;if(DD[k]){t.n=DD[k][1];t.i=DD[k][2]}});S.th='dark';theme();go()},'Restore all');

/* event delegation */
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-a]');if(!el)return;if(el.dataset.a==='ovc'&&ev.target!==el)return;const f=A[el.dataset.a];f&&f(el.dataset,el)});
document.addEventListener('keydown',ev=>{if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('[role=button][data-a]')){ev.preventDefault();ev.target.click()}});
document.addEventListener('change',ev=>{const f=C[ev.target.dataset.c];f&&f(ev.target)});
S=load();theme();render();save();
</script></body></html>
