function lib(){const act=ordCards().filter(c=>!c.hide);return back('Card library')+`<div class="card a1"><b>Cards on my home dashboard</b><div class=chips>${LIMS.map(n=>`<button class=chip style="${sel(S.lim===n)}" data-a=lim data-id=${n}>${n}</button>`).join('')}<button class=chip style="${sel(!S.lim)}" data-a=lim data-id=0>All active</button></div><div class=row style="margin-top:10px"><input type=number min=1 id=lc placeholder="Custom number" value="${S.lim&&!LIMS.includes(S.lim)?S.lim:''}"><button class=btn style="flex:none" data-a=limc>Set</button></div><small>Cards beyond the limit stay active and stay listed here. Nothing is deleted.</small></div><div class=card><b>Appearance</b><div class=chips>${thc()}</div></div><div class=row><button class=btn data-a=newcard>＋ Add card</button><button class=ghost data-a=showcats>Restore all</button></div><p class=hint>Drag ≡ to reorder, or use ↑ ↓ ⤓. ★ pins a card to the top of the dashboard. Hide means the card is switched off but its data is kept.</p><div>${S.cards.map(c=>`<div class="card a${c.a}" data-row=${c.id}><div class=row><span class=dh data-dh>≡</span><div style="flex:1"><b>${c.i} ${esc(c.n)}</b>${c.hide?' <small>(hidden)</small>':act.indexOf(c)>=(S.lim||99)?' <small>(not on dashboard)</small>':''}${c.d?'<br><small>'+esc(c.d)+'</small>':''}</div></div><div class=chips><button class=chip data-a=cpin data-id=${c.id}>${c.pin?'★ Pinned':'☆ Pin'}</button><button class=chip data-a=cup data-id=${c.id}>↑</button><button class=chip data-a=cdn data-id=${c.id}>↓</button><button class=chip data-a=cbot data-id=${c.id}>⤓ Bottom</button><button class=chip data-a=chide data-id=${c.id}>${c.hide?'＋ Activate':'− Hide'}</button><button class=chip data-a=editcard data-id=${c.id}>✎ Edit</button></div></div>`).join('')}</div>`}
function nj(){const c=(S.nj||{})[ymd()]||0,tot=Object.values(S.nj||{}).reduce((a,b)=>a+b,0);return back('Naam Jap counter')+`<div class="card a2" style="text-align:center"><label>Mantra (optional, only you see it)</label><input value="${esc(S.njm||'')}" data-c=njm placeholder="Your own mantra"><div style="font-size:72px;font-family:Georgia,serif;margin:10px 0">${c}</div><small>today · ${tot} all-time</small><button class=btn style="width:100%;height:120px;font-size:30px;margin-top:14px" data-a=njp>Tap · +1</button><div class=row style="margin-top:10px"><button class=ghost data-a=njn>−1</button><button class=ghost data-a=nj108>+108</button><button class=ghost data-a=njr>Reset today</button></div></div><p class=hint>The count saves on this device and is included in your JSON backup.</p>`}
function cardForm(id){const c=id?gc(id):null;AC=c?c.a:0;CE=c?c.id:null;if(!c)NF=[{l:'What I did',t:'t'},{l:'Minutes',t:'m'},{l:'How am I feeling?',t:'s',o:EM},{l:'Notes',t:'a'}];
 sheet(`<h3>${c?'Edit':'New'} card</h3><label>Title</label><input id=cd_n value="${esc(c?c.n:'')}" placeholder="e.g. Gardening, Law studies, AI tools"><label>Description</label><input id=cd_d value="${esc(c?c.d:'')}" placeholder="What is this card for?"><label>Icon (any emoji)</label><input id=cd_i value="${esc(c?c.i:'✦')}" maxlength=4><label>Accent colour</label><div class=chips id=sws>${swh()}</div>`+(c?'':`<label>Shows up under</label><select id=nt_t>${TABS.slice(1).map(x=>`<option value=${x[0]} ${x[0]==='growth'?'selected':''}>${x[1]}</option>`).join('')}</select><label>Fields for its first section (tap × to remove)</label><div class=chips id=nfl>${nfl()}</div><input id=nt_fl placeholder="Add your own field" style="margin-top:8px"><select id=nt_ft style="margin:8px 0">${Object.entries(TYP).map(([k,v])=>`<option value=${k}>${v}</option>`).join('')}</select><button class=ghost style="width:100%" data-a=nfa>＋ Add this field</button><div class=chips>${Object.entries(PRE).map(([k,v])=>`<button class=chip data-a=nfp data-k=${k}>＋ ${v.l}</button>`).join('')}</div><label class=chk style="margin-top:12px"><input type=checkbox id=cd_e> Count toward my daily progress</label>`)+`<div class=row style="margin-top:16px"><button class=btn data-a=savecard>Save card</button><button class=ghost data-a=close>Cancel</button></div>`+(c&&String(c.id)[0]==='u'?`<button class=ghost style="width:100%;margin-top:10px" data-a=delcard>🗑 Delete this card</button>`:''))}
A.lim=d=>{S.lim=+d.id;go()};A.limc=()=>{const n=Math.floor(+$('#lc').value);if(!(n>0))return toast('Enter a number above 0');S.lim=n;go()};
A.th=d=>{S.th=d.id;theme();go()};A.cpin=d=>{const c=gc(d.id);c.pin=c.pin?0:1;go()};A.chide=d=>{const c=gc(d.id);c.hide=c.hide?0:1;go()};
const mvc=(id,f)=>{const a=S.cards,i=a.findIndex(c=>String(c.id)===String(id)),j=f(i);if(j<0||j>=a.length)return;a.splice(j,0,a.splice(i,1)[0]);go()};
A.cup=d=>mvc(d.id,i=>i-1);A.cdn=d=>mvc(d.id,i=>i+1);A.cbot=d=>{const a=S.cards,i=a.findIndex(c=>String(c.id)===String(d.id));a.push(a.splice(i,1)[0]);go()};
A.editcard=d=>cardForm(d.id);A.newcard=()=>cardForm();A.sw=d=>{AC=+d.id;$('#sws').innerHTML=swh()};A.nfp=d=>{NF.push({...PRE[d.k]});$('#nfl').innerHTML=nfl()};
A.savecard=()=>{const n=$('#cd_n').value.trim();if(!n)return toast('Give the card a title');const v={n,d:$('#cd_d').value.trim(),i:$('#cd_i').value.trim()||'✦',a:AC};
 if(CE!==null)Object.assign(gc(CE),v);else{if(!NF.length)return toast('Add at least one field');const id='u'+Date.now(),tb=$('#nt_t').value;S.cards.push({id,hide:0,pin:0,...v});S.tr['c'+Date.now()]={n,i:v.i,tab:tb,tabs:[tb],cat:id,ess:$('#cd_e').checked?1:0,pin:0,hide:0,custom:1,f:NF.map((f,i)=>({k:'x'+i+Date.now().toString(36),l:f.l,t:f.t,o:f.o||'',h:0,c:1}))}}
 closeS();go();toast('Card saved')};
A.delcard=()=>{const c=gc(CE);ask(`Delete the card “${esc(c.n)}”? Only the card tile is removed. Its sections and every entry stay safe and move to “Personal growth”, so no history is lost. You can delete a section and its entries separately in Customise.`,()=>{Object.values(S.tr).forEach(t=>{if(t.cat==c.id)t.cat=9});S.cards=S.cards.filter(x=>x!==c);go();toast('Card deleted')})};
A.njp=()=>{const k=ymd();S.nj=S.nj||{};S.nj[k]=(S.nj[k]||0)+1;go()};A.nj108=()=>{const k=ymd();S.nj=S.nj||{};S.nj[k]=(S.nj[k]||0)+108;go()};A.njn=()=>{const k=ymd();S.nj=S.nj||{};S.nj[k]=Math.max(0,(S.nj[k]||0)-1);go()};
A.njr=()=>ask('Reset today’s Naam Jap count to zero?',()=>{S.nj=S.nj||{};S.nj[ymd()]=0;go()},'Reset');C.njm=el=>{S.njm=el.value;save()};
C.sq=el=>{V.q=el.value;render()};A.pq=d=>{V.q=d.n;render()};
let dg=null;document.addEventListener('pointerdown',e=>{const h=e.target.closest('[data-dh]');if(!h)return;dg=h.closest('[data-row]');dg.style.opacity=.6;try{h.setPointerCapture(e.pointerId)}catch(x){}e.preventDefault()});
document.addEventListener('pointermove',e=>{if(!dg)return;const o=document.elementFromPoint(e.clientX,e.clientY),r=o&&o.closest('[data-row]');if(r&&r!==dg){const b=r.getBoundingClientRect();r.parentNode.insertBefore(dg,e.clientY<b.top+b.height/2?r:r.nextSibling)}});
const dgEnd=()=>{if(!dg)return;dg.style.opacity='';const ids=[...document.querySelectorAll('[data-row]')].map(r=>r.dataset.row);S.cards.sort((a,b)=>ids.indexOf(String(a.id))-ids.indexOf(String(b.id)));dg=null;go()};document.addEventListener('pointerup',dgEnd);document.addEventListener('pointercancel',dgEnd);
A.quick=()=>{const Qk=[['work','Task'],['meals','Meal'],['reflect','Thought'],['ideas','Idea'],['inner','Emotion'],['art','Art'],['read','Reading'],['puzzle','Puzzle'],['move','Exercise'],['laugh','Laugh'],['dance','Dance'],['archive','Memory']];sheet(`<h3>Quick add</h3><button class=ghost style="width:100%;margin-bottom:10px" data-a=newtr>＋ Create my own section with my own fields</button><div class=chips>${Qk.filter(x=>!S.tr[x[0]].hide).map(x=>`<button class=chip data-a=add data-id=${x[0]}>${S.tr[x[0]].i} ${x[1]}</button>`).join('')}</div><h4>All trackers</h4><div class=chips>${Object.keys(S.tr).filter(k=>!S.tr[k].hide).map(k=>`<button class=chip data-a=add data-id=${k}>${S.tr[k].i} ${esc(S.tr[k].n)}</button>`).join('')}</div>`)};
A.addfield=d=>{fm(d.id);setTimeout(()=>$('#nf_l')&&$('#nf_l').focus(),50)};A.fm=d=>fm(d.id);
A.fhide=d=>{const f=S.tr[d.id].f[d.i];f.h=f.h?0:1;fch(d.id)};
A.fup=d=>{const a=S.tr[d.id].f,i=+d.i;if(i>0){[a[i-1],a[i]]=[a[i],a[i-1]];fch(d.id)}};A.fdn=d=>{const a=S.tr[d.id].f,i=+d.i;if(i<a.length-1){[a[i+1],a[i]]=[a[i],a[i+1]];fch(d.id)}};
A.fdel=d=>ask('Delete this custom field? Values already entered stay in your data and exports.',()=>{S.tr[d.id].f.splice(d.i,1);fch(d.id)});
A.fadd=d=>{const l=$('#nf_l').value.trim();if(!l)return toast('Give the field a name');S.tr[d.id].f.push({k:'x'+Date.now().toString(36),l,t:$('#nf_t').value,o:'',h:0,c:1});fch(d.id)};
C.ren=el=>{S.tr[el.dataset.id].f[el.dataset.i].l=el.value||'Field';save();render()};
A.newtr=d=>newTr(d.tab||(V.tab==='home'?'growth':V.tab));A.mktr=()=>{const n=$('#nt_n').value.trim();if(!n)return toast('Give it a name');if(!NF.length)return toast('Add at least one field');const id='c'+Date.now(),tb=$('#nt_t').value;S.tr[id]={n,i:'✦',tab:tb,tabs:[tb],cat:cid($('#nt_c').value),ess:0,pin:1,hide:0,custom:1,f:NF.map((f,i)=>({k:'x'+i+Date.now().toString(36),l:f.l,t:f.t,o:f.o||'',h:0,c:1}))};V.tab=tb;V.tr=null;closeS();go();toast('Section added. Find it under '+TN[V.tab]+' and pinned on Home')};
A.pin=d=>{S.tr[d.id].pin=S.tr[d.id].pin?0:1;go()};A.ess=d=>{S.tr[d.id].ess=S.tr[d.id].ess?0:1;go()};A.thide=d=>{S.tr[d.id].hide=S.tr[d.id].hide?0:1;go()};
A.tdel=d=>ask('Permanently delete this tracker AND all its entries? Hiding it instead keeps your history.',()=>{delete S.tr[d.id];S.e=S.e.filter(e=>e.t!==d.id);go()});
C.trn=el=>{S.tr[el.dataset.id].n=el.value||'Untitled';save()};C.ttab=el=>{const t=S.tr[el.dataset.id];t.tab=el.value;t.tabs=[el.value];save()};C.tcat=el=>{S.tr[el.dataset.id].cat=cid(el.value);save()};C.nm=el=>{S.name=el.value||'friend';save()};
A.qfav=d=>{const i=S.fq.indexOf(d.q);i<0?S.fq.push(d.q):S.fq.splice(i,1);go()};A.addq=()=>{const q=$('#nq').value.trim(),a=$('#na').value.trim();if(!q||!a)return toast('Quote and author are both needed');S.cq.push([q,a,'m']);go()};
C.img=el=>{if(!el.files[0])return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,520/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);const u=c.toDataURL('image/jpeg',.6);$('#f_'+el.dataset.k).value=u;const p=$('#pv_'+el.dataset.k);p.src=u;p.hidden=false};im.src=r.result};r.readAsDataURL(el.files[0])};
A.expj=()=>{const x=JSON.stringify(S);$('#bk').value=x;dl('lifeboard-backup-'+ymd()+'.json',x,'application/json');try{navigator.clipboard.writeText(x)}catch(e){}toast('Backup created')};
A.expc=()=>{const r=[['date','tracker','field','value']];S.e.forEach(e=>{const t=S.tr[e.t];if(!t)return;Object.entries(e.v).forEach(([k,v])=>{const f=t.f.find(f=>f.k===k);if(v!==''&&v!==false&&!(f&&f.t==='i'))r.push([e.d,t.n,f?f.l:k,v])})});const x=r.map(a=>a.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');$('#bk').value=x;dl('lifeboard-'+ymd()+'.csv',x,'text/csv');toast('CSV created')};
C.impf=el=>{const r=new FileReader();r.onload=()=>{$('#bk').value=r.result};if(el.files[0])r.readAsText(el.files[0])};
A.imp=()=>{let j;try{j=JSON.parse($('#bk').value)}catch(e){return toast('That is not a valid backup')}if(!j||j.v!==1||!j.e||!j.tr)return toast('Not a LIFEBOARD backup');ask('Replace everything currently in the app with this backup?',()=>{S=init(j);go();toast('Restored')},'Restore')};
A.sample=()=>{const n=Date.now(),P=[['ideas',0,{title:'Dairy-free hazelnut truffle',desc:'I would like to create a silky dairy-free truffle with roasted hazelnuts',cat:'Chocolate business',pri:'High',status:'Exploring',next:'Test the coconut cream ratio',done:false}],['ideas',1,{title:'Sunday art evening',desc:'I would like to paint with my children every Sunday',cat:'Children',pri:'Medium',status:'Completed',done:true}],['meals',0,{meal:'Breakfast',food:'Oats with berries',qty:'1 bowl'}],['move',1,{kind:'Yoga',min:'25',after:'Calm'}],['move',2,{kind:'Walking',min:'30'}],['read',0,{title:'Sample book',pages:'12',min:'20'}],['reflect',3,{kind:'Free writing',title:'A quiet evening',text:'Slowing down helped.'}],['inner',2,{emotion:'Grateful',trigger:'Call with parents'}]];P.forEach((p,i)=>S.e.push({id:n+i,t:p[0],d:ago(p[1]),v:p[2],s:1}));go();toast('Sample entries added')};
A.unsample=()=>ask('Remove the sample entries? Your own entries are not touched.',()=>{S.e=S.e.filter(e=>!e.s);go()},'Remove');
A.wipe=()=>ask('Erase ALL LIFEBOARD data on this device? Export a backup first.',()=>{S=init({v:1,name:S.name,tr:{},e:[]});go()},'Erase all');
A.nfa=()=>{const l=$('#nt_fl').value.trim();if(!l)return toast('Type a field name');NF.push({l,t:$('#nt_ft').value});$('#nt_fl').value='';$('#nfl').innerHTML=nfl()};
A.nfx=d=>{NF.splice(d.i,1);$('#nfl').innerHTML=nfl()};
A.addsec=d=>{const tb=d.tab,ks=Object.keys(S.tr).filter(k=>!inTab(S.tr[k],tb)||S.tr[k].hide);sheet(`<h3>Add a section to ${TN[tb]}</h3><p class=hint>A section can live in more than one area. Its entries are shared everywhere it appears.</p><div class=chips>${ks.map(k=>`<button class=chip data-a=putsec data-id=${k} data-tab=${tb}>${S.tr[k].i} ${esc(S.tr[k].n)}</button>`).join('')||'<small>Everything is already here.</small>'}</div><div class=row style="margin-top:16px"><button class=btn data-a=newtr data-tab=${tb}>＋ Create a new section</button><button class=ghost data-a=close>Close</button></div>`)};
A.putsec=d=>{const t=S.tr[d.id];t.tabs=t.tabs||[t.tab];if(!t.tabs.includes(d.tab))t.tabs.push(d.tab);t.hide=0;closeS();go();toast('Added to '+TN[d.tab])};
A.rmtab=d=>{const t=S.tr[d.id],tb=V.tab;t.tabs=(t.tabs||[t.tab]).filter(x=>x!==tb);if(t.tab===tb&&t.tabs.length)t.tab=t.tabs[0];go();toast('Removed from '+TN[tb]+'. Add it back with ＋')};
let tx=null,ty=0;document.addEventListener('touchstart',e=>{const c=e.target.closest('[data-sw]');tx=c?e.touches[0].clientX:null;ty=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{const c=e.target.closest('[data-sw]');if(tx!==null&&c&&e.changedTouches[0].clientX-tx<-90&&Math.abs(e.changedTouches[0].clientY-ty)<40)A.rmtab({id:c.dataset.sw});tx=null},{passive:true});
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-a]');if(!el)return;if(el.dataset.a==='ovc'&&ev.target!==el)return;const f=A[el.dataset.a];f&&f(el.dataset,el)});
document.addEventListener('change',ev=>{const f=C[ev.target.dataset.c];f&&f(ev.target)});
S=load();theme();render();
</script></body></html>
